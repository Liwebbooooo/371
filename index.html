<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>小学汉字学习</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif; background: #f5f0eb; color: #333; min-height: 100vh; -webkit-tap-highlight-color: transparent; }

/* Nav */
nav { display: flex; background: #fff; border-bottom: 2px solid #e8e0d5; position: sticky; top: 0; z-index: 100; }
nav button { flex: 1; padding: 14px 8px; border: none; background: none; font-size: 16px; cursor: pointer; color: #999; border-bottom: 3px solid transparent; transition: all .2s; }
nav button.active { color: #c0392b; border-bottom-color: #c0392b; font-weight: bold; }

/* Tabs */
.tab { display: none; padding: 16px; max-width: 600px; margin: 0 auto; }
.tab.active { display: block; }

/* === LEARN TAB === */
.char-nav { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 20px; }
.char-nav button { width: 40px; height: 40px; border: 2px solid #c0392b; border-radius: 50%; background: #fff; color: #c0392b; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.char-nav button:active { background: #c0392b; color: #fff; }
.char-nav .idx-display { font-size: 18px; min-width: 80px; text-align: center; }
.char-nav input { width: 60px; padding: 8px; border: 2px solid #ddd; border-radius: 8px; text-align: center; font-size: 16px; }

/* 田字格 */
.tzg-wrapper { display: flex; justify-content: center; margin-bottom: 8px; }
.tzg-container { position: relative; width: 200px; height: 200px; }
.tzg-container svg.tzg-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.tzg-container #hw-target { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.tzg-container #hw-target svg { width: 100%; height: 100%; }

.pinyin-display { text-align: center; font-size: 22px; color: #c0392b; margin-bottom: 20px; min-height: 30px; }

/* 组词 */
.words-section { margin-bottom: 20px; }
.words-section h3 { font-size: 15px; color: #999; margin-bottom: 8px; }
.word-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.word-tag { background: #fff; border: 1px solid #ddd; border-radius: 20px; padding: 8px 16px; cursor: pointer; font-size: 15px; transition: all .2s; }
.word-tag:active { background: #c0392b; color: #fff; border-color: #c0392b; }
.word-tag .wpinyin { display: block; font-size: 11px; color: #999; margin-top: 2px; }
.word-tag:active .wpinyin { color: rgba(255,255,255,.7); }

/* 例句 */
.sentence-section { margin-bottom: 20px; }
.sentence-section h3 { font-size: 15px; color: #999; margin-bottom: 8px; }
.sentence-box { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 16px; cursor: pointer; transition: all .2s; }
.sentence-box:active { background: #fdf2f2; border-color: #c0392b; }
.sentence-box .stext { font-size: 18px; line-height: 1.6; }
.sentence-box .spinyin { font-size: 13px; color: #999; margin-top: 4px; }

/* === DICTATION TAB === */
.dict-settings { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
.dict-settings .row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.dict-settings label { font-size: 15px; min-width: 80px; }
.dict-settings input { width: 80px; padding: 8px; border: 2px solid #ddd; border-radius: 8px; text-align: center; font-size: 16px; }

.btn { padding: 10px 24px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; transition: all .2s; }
.btn-primary { background: #c0392b; color: #fff; }
.btn-primary:active { background: #a93226; }
.btn-secondary { background: #eee; color: #333; }
.btn-secondary:active { background: #ddd; }

.dict-area { background: #fff; border-radius: 12px; padding: 24px; text-align: center; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
.dict-progress { font-size: 14px; color: #999; }
.dict-char-big { font-size: 60px; color: #c0392b; display: none; }
.dict-char-big.visible { display: block; }
.dict-controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.dict-result { margin-top: 16px; }
.dict-result .mark-row { display: flex; gap: 12px; justify-content: center; margin-top: 8px; }
.btn-correct { background: #27ae60; color: #fff; }
.btn-correct:active { background: #219a52; }
.btn-wrong { background: #e74c3c; color: #fff; }
.btn-wrong:active { background: #c0392b; }

/* === PROGRESS TAB === */
.progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.progress-stats { font-size: 14px; color: #999; }
.char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; }
.char-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 16px; cursor: pointer; border: 2px solid #eee; background: #fff; transition: all .2s; position: relative; }
.char-cell.passed { background: #eafaf1; border-color: #27ae60; color: #27ae60; }
.char-cell.failed { background: #fdedec; border-color: #e74c3c; color: #e74c3c; }
.char-cell .cell-num { position: absolute; top: 2px; left: 4px; font-size: 9px; color: #ccc; }
.char-cell.passed .cell-num, .char-cell.failed .cell-num { color: inherit; opacity: .6; }

/* === SHARED === */
.tip { text-align: center; color: #999; font-size: 13px; margin-top: 8px; cursor: pointer; }
</style>
</head>
<body>

<nav>
  <button class="active" data-tab="learn">📖 识字学习</button>
  <button data-tab="dictation">📝 听写训练</button>
  <button data-tab="progress">📊 学习进度</button>
</nav>

<!-- ========== TAB 1: 识字学习 ========== -->
<div class="tab active" id="tab-learn">
  <div class="char-nav">
    <button id="btn-prev">◀</button>
    <div class="idx-display">
      <span id="idx-label">第 1 个</span>
    </div>
    <button id="btn-next">▶</button>
  </div>
  <div style="text-align:center;margin-bottom:12px;">
    <input type="number" id="jump-input" placeholder="跳转序号" min="1" max="2948">
    <button class="btn btn-secondary" id="btn-jump" style="font-size:14px;padding:6px 14px;">跳转</button>
  </div>

  <div class="tzg-wrapper">
    <div class="tzg-container">
      <svg class="tzg-bg" viewBox="0 0 200 200">
        <rect x="1" y="1" width="198" height="198" fill="none" stroke="#c0392b" stroke-width="3"/>
        <line x1="100" y1="0" x2="100" y2="200" stroke="#e8d5d5" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="0" y1="100" x2="200" y2="100" stroke="#e8d5d5" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="0" y1="66" x2="200" y2="66" stroke="#f0e8e8" stroke-width="0.5"/>
        <line x1="0" y1="133" x2="200" y2="133" stroke="#f0e8e8" stroke-width="0.5"/>
        <line x1="66" y1="0" x2="66" y2="200" stroke="#f0e8e8" stroke-width="0.5"/>
        <line x1="133" y1="0" x2="133" y2="200" stroke="#f0e8e8" stroke-width="0.5"/>
      </svg>
      <div id="hw-target"></div>
    </div>
  </div>
  <div class="tip" id="hw-tip" style="margin-bottom:12px;">👆 点击田字格，听发音 + 看笔画动画</div>

  <div class="pinyin-display" id="pinyin-display"></div>

  <div class="words-section">
    <h3>📝 组词（点击可听发音）</h3>
    <div class="word-tags" id="words-container"></div>
  </div>

  <div class="sentence-section">
    <h3>📜 例句（点击可听整句发音）</h3>
    <div class="sentence-box" id="sentence-box">
      <div class="stext" id="sentence-text"></div>
      <div class="spinyin" id="sentence-pinyin"></div>
    </div>
  </div>
</div>

<!-- ========== TAB 2: 听写训练 ========== -->
<div class="tab" id="tab-dictation">
  <div class="dict-settings">
    <div class="row">
      <label>起始序号</label>
      <input type="number" id="dict-start" value="1" min="1" max="2948">
      <label>结束序号</label>
      <input type="number" id="dict-end" value="10" min="1" max="2948">
    </div>
    <div style="text-align:center;">
      <button class="btn btn-primary" id="btn-dict-start">开始听写</button>
      <button class="btn btn-secondary" id="btn-dict-stop" style="display:none;">停止</button>
    </div>
  </div>

  <div class="dict-area" id="dict-area">
    <div class="dict-progress" id="dict-progress">设置范围后点击"开始听写"</div>
    <div class="dict-char-big" id="dict-char-big"></div>
    <div class="dict-controls" id="dict-controls" style="display:none;">
      <button class="btn btn-primary" id="btn-dict-replay">🔊 再听一次</button>
      <button class="btn btn-secondary" id="btn-dict-reveal">👁 显示答案</button>
    </div>
    <div class="dict-result" id="dict-result" style="display:none;">
      <div class="mark-row">
        <button class="btn btn-correct" id="btn-dict-correct">✅ 正确</button>
        <button class="btn btn-wrong" id="btn-dict-wrong">❌ 错误</button>
      </div>
    </div>
  </div>

  <div style="margin-top:16px;">
    <h3 style="font-size:15px;color:#999;margin-bottom:8px;">听写结果</h3>
    <div id="dict-summary" style="color:#999;">暂无结果</div>
  </div>
</div>

<!-- ========== TAB 3: 学习进度 ========== -->
<div class="tab" id="tab-progress">
  <div class="progress-header">
    <div class="progress-stats" id="progress-stats"></div>
    <button class="btn btn-secondary" id="btn-reset-progress" style="font-size:14px;padding:6px 14px;">重置进度</button>
  </div>
  <div class="char-grid" id="char-grid"></div>
</div>

<script src="char_data.js"></script>
<script src="hanzi-writer.min.js"></script>

<script>
(function() {
  'use strict';

  // ============ STATE ============
  var state = {
    tab: 'learn',
    idx: 0,              // 0-based current char index
    dict: { active: false, start: 1, end: 10, pos: 0, chars: [], results: [] },
    progress: {}
  };

  // 从 localStorage 加载进度
  try { state.progress = JSON.parse(localStorage.getItem('xsz_progress') || '{}'); } catch(e) {}

  // ============ DATA HELPERS ============
  var charKeys = [];  // sorted by number
  function initCharKeys() {
    charKeys = Object.keys(window.CHAR_DATA).sort(function(a, b) { return Number(a) - Number(b); });
  }
  initCharKeys();

  function getCharData(idx) {
    var key = charKeys[idx];
    return key ? window.CHAR_DATA[key] : null;
  }

  function getCharKey(idx) {
    return charKeys[idx] || '';
  }

  // ============ STROKE LOADER ============
  var strokeIdx = null;
  var strokeCache = {};       // batchNum -> charData
  var strokeIdxPromise = null;
  var strokeBatchPromises = {};

  function loadStrokeData(ch, onComplete, onError) {
    // 确保索引已加载
    function doLoad() {
      var batch = strokeIdx[ch];
      if (batch === undefined) { onError('no stroke data for ' + ch); return; }

      if (strokeCache[batch] && strokeCache[batch][ch]) {
        onComplete(strokeCache[batch][ch]);
        return;
      }

      if (strokeBatchPromises[batch]) {
        strokeBatchPromises[batch].then(function(data) {
          if (data && data[ch]) onComplete(data[ch]);
          else onError('char not in batch');
        }).catch(onError);
        return;
      }

      strokeBatchPromises[batch] = fetch('./hwdata/batch_' + batch + '.json')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          strokeCache[batch] = data;
          return data;
        });

      strokeBatchPromises[batch].then(function(data) {
        if (data && data[ch]) onComplete(data[ch]);
        else onError('char not in batch');
      }).catch(onError);
    }

    if (strokeIdx) { doLoad(); return; }

    if (strokeIdxPromise) {
      strokeIdxPromise.then(doLoad).catch(onError);
      return;
    }

    strokeIdxPromise = fetch('./hwdata/batch_index.json')
      .then(function(r) { return r.json(); })
      .then(function(data) { strokeIdx = data; });

    strokeIdxPromise.then(doLoad).catch(onError);
  }

  // ============ TTS ============
  var ttsTimer = null;
  function speak(text, rate) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    if (ttsTimer) clearTimeout(ttsTimer);
    ttsTimer = setTimeout(function() {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN';
      u.rate = rate || 0.8;
      u.pitch = 1;
      u.volume = 1;
      window.speechSynthesis.speak(u);
    }, 50);
  }

  // ============ HANZI WRITER ============
  var hw = null;
  var hwReady = false;

  function destroyHW() {
    if (hw) {
      try { hw._target.innerHTML = ''; } catch(e) {}
      hw = null;
    }
    hwReady = false;
  }

  function initHW(ch) {
    destroyHW();
    var target = document.getElementById('hw-target');
    target.innerHTML = '';

    // showCharacter: true 确保汉字始终可见（填充模式）
    // 数据加载成功后切换到空心轮廓
    hw = HanziWriter.create(target, ch, {
      width: 200,
      height: 200,
      padding: 5,
      showCharacter: true,
      strokeAnimationSpeed: 1.5,
      delayBetweenStrokes: 200,
      charDataLoader: loadStrokeData,
      onLoadCharDataSuccess: function() {
        hwReady = true;
        // 隐藏填充字符，显示空心轮廓
        try { hw.hideCharacter(); } catch(e) {}
        try { hw.showOutline(); } catch(e) {}
      },
      onLoadCharDataError: function(err) {
        // showCharacter:true 兜底，填充汉字始终可见
        console.warn('Stroke data not loaded:', err);
      }
    });
  }

  function playHW() {
    if (!hw || !hwReady) return;
    document.getElementById('hw-tip').style.display = 'none';
    // 隐藏轮廓，显示填充字符，播放动画
    try { hw.hideOutline(); } catch(e) {}
    try { hw.showCharacter(); } catch(e) {}
    try {
      hw.animateCharacter({
        onComplete: function() {
          // 动画结束后恢复空心轮廓
          try { hw.hideCharacter(); } catch(e) {}
          try { hw.showOutline(); } catch(e) {}
        }
      });
    } catch(e) {
      // 降级：直接显示字符
      try { hw.showCharacter(); } catch(e2) {}
    }
  }

  // ============ RENDER LEARN TAB ============
  function renderLearn() {
    var data = getCharData(state.idx);
    if (!data) return;

    var ch = data.char;

    document.getElementById('idx-label').textContent = '第 ' + (state.idx + 1) + ' 个';
    document.getElementById('pinyin-display').textContent = data.pinyin;

    // Render words
    var wordsHtml = '';
    (data.words || []).forEach(function(w) {
      wordsHtml += '<div class="word-tag" onclick="speakWord(this)" data-text="' + w.word + '">' +
        '<span>' + w.word + '</span>' +
        '<span class="wpinyin">' + w.pinyin + '</span>' +
        '</div>';
    });
    document.getElementById('words-container').innerHTML = wordsHtml;

    // Render sentence
    document.getElementById('sentence-text').textContent = data.sentence || '';
    document.getElementById('sentence-pinyin').textContent = data.sentencePinyin || '';

    // Init HanziWriter
    document.getElementById('hw-tip').style.display = 'block';
    initHW(ch);
  }

  // ============ EVENT HANDLERS ============
  // Tab switching
  document.querySelectorAll('nav button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var tab = this.getAttribute('data-tab');
      switchTab(tab);
    });
  });

  function switchTab(tab) {
    state.tab = tab;
    document.querySelectorAll('nav button').forEach(function(b) { b.classList.remove('active'); });
    document.querySelector('nav button[data-tab="' + tab + '"]').classList.add('active');
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    document.getElementById('tab-' + tab).classList.add('active');

    if (tab === 'learn') renderLearn();
    if (tab === 'progress') renderProgress();
  }

  // Previous/Next
  document.getElementById('btn-prev').addEventListener('click', function() {
    if (state.idx > 0) { state.idx--; renderLearn(); }
  });
  document.getElementById('btn-next').addEventListener('click', function() {
    if (state.idx < charKeys.length - 1) { state.idx++; renderLearn(); }
  });

  // Jump
  document.getElementById('btn-jump').addEventListener('click', function() {
    var num = parseInt(document.getElementById('jump-input').value);
    if (num >= 1 && num <= charKeys.length) {
      state.idx = num - 1;
      renderLearn();
    }
  });
  document.getElementById('jump-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('btn-jump').click();
  });

  // 田字格点击
  document.getElementById('hw-target').addEventListener('click', function() {
    var data = getCharData(state.idx);
    if (!data) return;
    // 先发音
    speak(data.char, 0.7);
    // 延迟一点再动画
    setTimeout(function() { playHW(); }, 150);
  });

  // 组词点击发音
  window.speakWord = function(el) {
    var text = el.getAttribute('data-text');
    if (text) speak(text, 0.8);
  };

  // 例句点击发音
  document.getElementById('sentence-box').addEventListener('click', function() {
    var data = getCharData(state.idx);
    if (data && data.sentence) speak(data.sentence, 0.85);
  });

  // ============ DICTATION ============
  var dictState = { active: false, chars: [], pos: 0, results: [], revealed: false };

  document.getElementById('btn-dict-start').addEventListener('click', startDictation);
  document.getElementById('btn-dict-stop').addEventListener('click', stopDictation);
  document.getElementById('btn-dict-replay').addEventListener('click', function() {
    if (dictState.active && dictState.pos < dictState.chars.length) {
      var ch = dictState.chars[dictState.pos];
      speakCharTwice(ch);
    }
  });
  document.getElementById('btn-dict-reveal').addEventListener('click', function() {
    if (!dictState.active) return;
    dictState.revealed = true;
    var ch = dictState.chars[dictState.pos];
    var el = document.getElementById('dict-char-big');
    el.textContent = ch;
    el.classList.add('visible');
    document.getElementById('dict-result').style.display = 'block';
  });
  document.getElementById('btn-dict-correct').addEventListener('click', function() {
    markDictResult(true);
  });
  document.getElementById('btn-dict-wrong').addEventListener('click', function() {
    markDictResult(false);
  });

  function speakCharTwice(ch) {
    speak(ch, 0.7);
    setTimeout(function() { speak(ch, 0.7); }, 1800);
  }

  function startDictation() {
    var s = parseInt(document.getElementById('dict-start').value) || 1;
    var e = parseInt(document.getElementById('dict-end').value) || 10;
    if (s < 1) s = 1;
    if (e > charKeys.length) e = charKeys.length;
    if (s > e) { var t = s; s = e; e = t; }

    dictState.active = true;
    dictState.pos = 0;
    dictState.results = [];
    dictState.revealed = false;
    dictState.chars = [];
    for (var i = s - 1; i < e; i++) {
      var d = getCharData(i);
      if (d) dictState.chars.push(d.char);
    }

    document.getElementById('btn-dict-start').style.display = 'none';
    document.getElementById('btn-dict-stop').style.display = 'inline-block';
    document.getElementById('dict-controls').style.display = 'flex';
    document.getElementById('dict-result').style.display = 'none';
    document.getElementById('dict-char-big').classList.remove('visible');
    document.getElementById('dict-char-big').textContent = '';
    document.getElementById('dict-summary').textContent = '';

    nextDictChar();
  }

  function stopDictation() {
    dictState.active = false;
    document.getElementById('btn-dict-start').style.display = 'inline-block';
    document.getElementById('btn-dict-stop').style.display = 'none';
    document.getElementById('dict-controls').style.display = 'none';
    document.getElementById('dict-result').style.display = 'none';
    document.getElementById('dict-char-big').classList.remove('visible');
    document.getElementById('dict-char-big').textContent = '';
    document.getElementById('dict-progress').textContent = '听写已停止';
  }

  function nextDictChar() {
    if (!dictState.active) return;
    
    if (dictState.pos >= dictState.chars.length) {
      finishDictation();
      return;
    }

    dictState.revealed = false;
    var ch = dictState.chars[dictState.pos];
    document.getElementById('dict-progress').textContent = '第 ' + (dictState.pos + 1) + ' / ' + dictState.chars.length + ' 个';
    document.getElementById('dict-char-big').classList.remove('visible');
    document.getElementById('dict-char-big').textContent = '';
    document.getElementById('dict-result').style.display = 'none';
    document.getElementById('dict-controls').style.display = 'flex';

    // 朗读 2 遍，间隔 1.5 秒
    speakCharTwice(ch);
  }

  function markDictResult(correct) {
    if (!dictState.active) return;
    
    var ch = dictState.chars[dictState.pos];
    var key = String(dictState.pos + 1 + (parseInt(document.getElementById('dict-start').value) || 1) - 1);
    // 找出字符在 CHAR_DATA 中的序号
    var idxInData = charKeys.indexOf(key);
    // Actually, let's use a simpler approach: track by the actual char index
    
    dictState.results.push({ char: ch, correct: correct });
    
    // 更新进度
    var dataIdx = state.idx; // current doesn't match dict...
    // 找到 dict char 在全局中的序号
    for (var i = 0; i < charKeys.length; i++) {
      var d = getCharData(i);
      if (d && d.char === ch) {
        state.progress[charKeys[i]] = correct ? 'passed' : 'failed';
        break;
      }
    }
    saveProgress();

    dictState.pos++;
    document.getElementById('dict-result').style.display = 'none';
    
    setTimeout(function() { nextDictChar(); }, 600);
  }

  function finishDictation() {
    dictState.active = false;
    var total = dictState.results.length;
    var correct = dictState.results.filter(function(r) { return r.correct; }).length;
    
    document.getElementById('btn-dict-start').style.display = 'inline-block';
    document.getElementById('btn-dict-stop').style.display = 'none';
    document.getElementById('dict-controls').style.display = 'none';
    document.getElementById('dict-result').style.display = 'none';
    document.getElementById('dict-char-big').classList.remove('visible');
    document.getElementById('dict-char-big').textContent = '';
    document.getElementById('dict-progress').textContent = '听写完成！';
    
    var summary = '共 ' + total + ' 个字，正确 ' + correct + ' 个，错误 ' + (total - correct) + ' 个';
    if (total > 0) summary += '（正确率 ' + Math.round(correct / total * 100) + '%）';
    
    var detailHtml = summary + '<br><br>';
    dictState.results.forEach(function(r, i) {
      var icon = r.correct ? '✅' : '❌';
      detailHtml += icon + ' ' + r.char + ' ';
      if ((i + 1) % 8 === 0) detailHtml += '<br>';
    });
    
    document.getElementById('dict-summary').innerHTML = detailHtml;
    renderProgress();

    // 播报结果
    speak('听写完成，共' + total + '个字，正确' + correct + '个。', 0.9);
  }

  // ============ PROGRESS ============
  function saveProgress() {
    try { localStorage.setItem('xsz_progress', JSON.stringify(state.progress)); } catch(e) {}
  }

  function renderProgress() {
    var total = charKeys.length;
    var passed = 0, failed = 0;
    for (var i = 0; i < charKeys.length; i++) {
      if (state.progress[charKeys[i]] === 'passed') passed++;
      else if (state.progress[charKeys[i]] === 'failed') failed++;
    }

    document.getElementById('progress-stats').textContent = 
      '共 ' + total + ' 字 | 过关 ' + passed + ' | 未过关 ' + failed + ' | 未测 ' + (total - passed - failed);

    var gridHtml = '';
    for (var i = 0; i < charKeys.length; i++) {
      var d = getCharData(i);
      if (!d) continue;
      var st = state.progress[charKeys[i]] || '';
      var cls = st === 'passed' ? ' passed' : (st === 'failed' ? ' failed' : '');
      gridHtml += '<div class="char-cell' + cls + '" data-idx="' + i + '" title="第' + (i+1) + '个: ' + d.char + '">' +
        '<span class="cell-num">' + (i + 1) + '</span>' +
        d.char +
        '</div>';
    }
    document.getElementById('char-grid').innerHTML = gridHtml;

    // 点击跳转到学习页面
    document.querySelectorAll('#char-grid .char-cell').forEach(function(cell) {
      cell.addEventListener('click', function() {
        var idx = parseInt(this.getAttribute('data-idx'));
        state.idx = idx;
        switchTab('learn');
      });
    });
  }

  document.getElementById('btn-reset-progress').addEventListener('click', function() {
    if (confirm('确定要重置所有进度吗？此操作不可撤销。')) {
      state.progress = {};
      saveProgress();
      renderProgress();
    }
  });

  // ============ INIT ============
  renderLearn();
  renderProgress();

})();
</script>

</body>
</html>
